    <style>
:root {
  color-scheme: light dark;
  --ls-app-bg: #111217;
  --ls-toolbar-bg: rgba(20, 22, 28, 0.86);
  --ls-toolbar-border: rgba(255, 255, 255, 0.12);
  --ls-toolbar-fg: #f5f7fb;
  --ls-muted-fg: rgba(245, 247, 251, 0.68);
  --ls-accent: #1456f0;
  --ls-slide-bg: #ffffff;
  --ls-control-size: 36px;
  --ls-radius: 8px;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--ls-app-bg);
  color: #1f2329;
  font-family: var(--ld-font-ui, "Inter", "FZLanTingHeiPro_GB18030", "PingFang SC", "Microsoft YaHei", Arial, sans-serif);
  overflow: hidden;
}

.ls-app {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: 1fr auto;
  place-items: center;
  background: var(--ls-app-bg);
}

.ls-app[data-lark-theme="larkVisual"] {
  --ls-app-bg: #111217;
  --ls-slide-bg: #000000;
  --ls-accent: #1456f0;
}

.ls-stage {
  position: relative;
  width: min(100vw, calc((100vh - 72px) * 16 / 9));
  max-width: 100vw;
  aspect-ratio: 16 / 9;
  background: var(--ls-slide-bg);
  overflow: hidden;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
}

.ls-app.ls-no-controls {
  grid-template-rows: 1fr;
}

.ls-app.ls-no-controls .ls-stage {
  width: min(100vw, calc(100vh * 16 / 9));
  box-shadow: none;
}

.ls-app.ls-presenting {
  grid-template-rows: 1fr;
  background: #000;
}

.ls-app.ls-presenting .ls-stage {
  width: min(100vw, calc(100vh * 16 / 9));
  max-width: 100vw;
  box-shadow: none;
}

.ls-app.ls-presenting .ls-toolbar,
.ls-app.ls-presenting .ls-progress {
  opacity: 0;
  pointer-events: none;
}

.ls-slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: var(--ls-slide-bg);
  overflow: hidden;
}

.ls-slide[hidden] {
  display: none !important;
}

.ls-slide-inner {
  position: absolute;
  top: 0;
  left: 0;
  width: 1600px;
  height: 900px;
  transform-origin: top left;
  background: #fff;
  overflow: hidden;
}

.ls-element {
  position: absolute;
  box-sizing: border-box;
}

.ls-text {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  white-space: pre-wrap;
  overflow: visible;
}

.ls-text p {
  margin: 0;
}

.ls-text span {
  white-space: pre-wrap;
}

.ls-picture,
.ls-vector {
  overflow: hidden;
}

.ls-picture img {
  position: absolute;
  display: block;
  max-width: none;
  object-fit: fill;
}

.ls-slide img[data-src] {
  opacity: 0;
  transition: opacity 180ms ease;
}

.ls-slide img[data-src].is-loaded,
.ls-slide img[data-src][data-ls-loaded="true"] {
  opacity: 1;
}

.ls-shape {
  overflow: hidden;
}

.ls-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 56px;
  padding: 10px 12px;
  color: var(--ls-toolbar-fg);
  background: var(--ls-toolbar-bg);
  border: 1px solid var(--ls-toolbar-border);
  border-radius: var(--ls-radius);
  backdrop-filter: blur(14px);
}

.ls-button {
  width: var(--ls-control-size);
  height: var(--ls-control-size);
  display: inline-grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 6px;
  color: var(--ls-toolbar-fg);
  background: rgba(255, 255, 255, 0.08);
  cursor: pointer;
  font: inherit;
}

.ls-button:hover {
  background: rgba(255, 255, 255, 0.14);
}

.ls-button:focus-visible {
  outline: 2px solid #8ab4ff;
  outline-offset: 2px;
}

.ls-button-icon {
  width: 18px;
  height: 18px;
  display: block;
}

.ls-status {
  min-width: 64px;
  text-align: center;
  color: var(--ls-muted-fg);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.ls-progress {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: rgba(255, 255, 255, 0.12);
}

.ls-progress-bar {
  width: 0;
  height: 100%;
  background: var(--ls-accent);
  transition: width 160ms ease;
}

.ls-template-slide {
  width: 1600px;
  height: 900px;
  padding: 88px 104px;
  box-sizing: border-box;
  background: #fff;
}

.ls-template-kicker {
  margin: 0 0 20px;
  color: #1456f0;
  font-size: 30px;
  font-weight: 700;
}

.ls-template-title {
  margin: 0;
  color: #111217;
  font-size: 76px;
  line-height: 1.05;
  font-weight: 760;
}

.ls-template-subtitle {
  max-width: 980px;
  margin: 28px 0 0;
  color: #4e5969;
  font-size: 32px;
  line-height: 1.42;
}

.ls-template-grid {
  display: grid;
  gap: 28px;
}

.ls-template-card {
  border: 1px solid #dee0e3;
  border-radius: 8px;
  padding: 28px;
  background: #fff;
}

.ls-template-metric {
  font-size: 108px;
  line-height: 1;
  font-weight: 760;
  color: #1456f0;
}

.ls-template-label {
  margin-top: 16px;
  color: #4e5969;
  font-size: 28px;
  line-height: 1.35;
}

.ls-visual .ls-slide-inner {
  background: #000;
}

  </head>
  <body>
    <div id="deck" data-lark-deck></div>
    <script>
(function () {
  "use strict";

  const DEFAULT_SIZE = { width: 1600, height: 900 };
  const themes = {};
  const DEFAULT_TEXT_SAVE_DEBOUNCE_MS = 600;

  defineTheme("default", {
    className: "ls-theme-default",
    cssVars: {},
  });

  defineTheme("larkVisual", {
    className: "ls-theme-lark-visual",
    cssVars: {
      "--ls-app-bg": "#111217",
      "--ls-slide-bg": "#000000",
      "--ls-accent": "#1456f0",
    },
  });

  function toElement(slide, index) {
    if (slide instanceof HTMLElement) return slide;

    const section = document.createElement("section");
    section.className = `ls-slide ${slide.className || ""}`.trim();
    section.dataset.index = String(index + 1);
    if (slide.id) section.id = slide.id;
    if (slide.title) section.dataset.title = slide.title;
    if (slide.template) section.dataset.template = slide.template;
    if (slide.sourceSlide) section.dataset.sourceSlide = String(slide.sourceSlide);
    section.setAttribute("aria-label", slide.title || `Slide ${index + 1}`);

    const inner = document.createElement("div");
    inner.className = "ls-slide-inner";
    inner.innerHTML = typeof slide === "string" ? slide : slide.content || "";
    section.appendChild(inner);
    return section;
  }

  function ensureStructure(mount) {
    let stage = mount.querySelector(":scope > .ls-stage");
    if (stage) return stage;

    stage = document.createElement("div");
    stage.className = "ls-stage";

    const existingSlides = Array.from(mount.querySelectorAll(":scope > .ls-slide"));
    for (const slide of existingSlides) stage.appendChild(slide);
    mount.appendChild(stage);
    return stage;
  }

  function ensureInner(slide) {
    let inner = slide.querySelector(":scope > .ls-slide-inner");
    if (!inner) {
      inner = document.createElement("div");
      inner.className = "ls-slide-inner";
      while (slide.firstChild) inner.appendChild(slide.firstChild);
      slide.appendChild(inner);
    }
    return inner;
  }

  function mountControls(deck) {
    if (!deck.options.controls) return null;

    const listenerOptions = deck.eventListenerOptions || undefined;
    const toolbar = document.createElement("div");
    toolbar.className = "ls-toolbar";
    toolbar.setAttribute("role", "toolbar");
    toolbar.setAttribute("aria-label", "Slide controls");

    const prev = button("上一页", "‹", () => deck.prev(), listenerOptions);
    const next = button("下一页", "›", () => deck.next(), listenerOptions);
    const share = button("复制当前页链接", copyLinkIcon(), () => {
      deck.copyCurrentSlideLink().catch((error) => {
        showToolbarMessage(deck, "复制失败", 1600);
        if (deck.options.textSync?.onError) deck.options.textSync.onError(error, deck);
      });
    }, listenerOptions);
    const fullscreen = button("全屏播放", fullscreenIcon(), () => deck.toggleFullscreen(), listenerOptions);

    const status = document.createElement("div");
    status.className = "ls-status";
    status.setAttribute("aria-live", "polite");
    deck.status = status;

    toolbar.append(prev, status, next);
    if (deck.options.share) toolbar.appendChild(share);
    toolbar.appendChild(fullscreen);
    deck.mount.appendChild(toolbar);

    const progress = document.createElement("div");
    progress.className = "ls-progress";
    const bar = document.createElement("div");
    bar.className = "ls-progress-bar";
    progress.appendChild(bar);
    deck.mount.appendChild(progress);
    deck.progressBar = bar;

    return toolbar;
  }

  function button(label, text, onClick, listenerOptions) {
    const el = document.createElement("button");
    el.className = "ls-button";
    el.type = "button";
    el.setAttribute("aria-label", label);
    el.title = label;
    if (text instanceof Node) el.appendChild(text);
    else el.textContent = text;
    el.addEventListener("click", onClick, listenerOptions);
    return el;
  }

  function iconSvg(children) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "ls-button-icon");
    svg.setAttribute("viewBox", "0 0 20 20");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.7");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    children.forEach(([name, attrs]) => {
      const child = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs).forEach(([key, value]) => child.setAttribute(key, value));
      svg.appendChild(child);
    });
    return svg;
  }

  function copyLinkIcon() {
    return iconSvg([
      ["rect", { x: "7.5", y: "7.5", width: "9", height: "9", rx: "1.8" }],
      ["path", { d: "M4 12.5V5.8C4 4.8 4.8 4 5.8 4h6.7" }],
    ]);
  }

  function fullscreenIcon() {
    return iconSvg([
      ["path", { d: "M7.2 4H4v3.2" }],
      ["path", { d: "M12.8 4H16v3.2" }],
      ["path", { d: "M16 12.8V16h-3.2" }],
      ["path", { d: "M4 12.8V16h3.2" }],
    ]);
  }

  function renderDeck(deck) {
    if (deck.options.slides?.length) {
      deck.stage.replaceChildren(
        ...deck.options.slides.map((slide, index) => toElement(slide, index))
      );
    }

    deck.slides = Array.from(deck.stage.querySelectorAll(":scope > .ls-slide"));
    deck.slideInners = deck.slides.map((slide, index) => {
      const inner = ensureInner(slide);
      slide.dataset.index = slide.dataset.index || String(index + 1);
      setSlideActive(slide, index === deck.index);
      return inner;
    });
    annotateEditableText(deck.slides);
    setupTextSync(deck);

    if (!deck.controls) deck.controls = mountControls(deck);
    deck.updateScale();
    deck.goTo(deck.index, { replace: true });
    return deck;
  }

  function createDeck(rawOptions = {}) {
    const options = normalizeCreateOptions(rawOptions);
    const mount =
      typeof options.mount === "string"
        ? document.querySelector(options.mount)
        : options.mount || document.querySelector("[data-lark-deck]");

    if (!mount) throw new Error("LarkSlides: missing mount element");
    mount.classList.add("ls-app");
    mount.classList.toggle("ls-no-controls", options.controls === false);
    const eventController = typeof AbortController !== "undefined" ? new AbortController() : null;
    const eventListenerOptions = eventController ? { signal: eventController.signal } : undefined;

    const deck = {
      mount,
      stage: ensureStructure(mount),
      eventController,
      eventListenerOptions,
      options: {
        controls: options.controls !== false,
        keyboard: options.keyboard !== false,
        hash: options.hash !== false,
        share: options.share !== false,
        textSync: normalizeTextSyncOptions(options.textSync || options.remoteText || options.textStore),
        size: options.size || DEFAULT_SIZE,
        slides: options.slides || null,
        theme: options.theme || "default",
        metadata: options.metadata || options.meta || {},
      },
      index: readHashIndex() || 0,
      slides: [],
      slideInners: [],
      controls: null,
      status: null,
      progressBar: null,
      scaleFrame: 0,
      scaleTransform: "",
      statusMessageTimer: 0,
      wheelLock: 0,
      touchStartY: null,
      textSync: null,
      theme: null,
      updateScale,
      enterFullscreen,
      exitFullscreen,
      toggleFullscreen,
      syncPresentationState,
      isPresenting,
      loadRemoteTexts() {
        return loadRemoteTexts(this);
      },
      saveCurrentTexts() {
        return saveCurrentTexts(this);
      },
      getCurrentSlideLink() {
        return currentSlideLink(this);
      },
      copyCurrentSlideLink() {
        return copyCurrentSlideLink(this);
      },
      renderDeck() {
        return renderDeck(this);
      },
      goTo(index, meta = {}) {
        const numeric = normalizeIndex(index, this.slides.length);
        const previous = this.index;
        this.index = numeric;
        setSlideActive(this.slides[previous], false);
        setSlideActive(this.slides[numeric], true);
        preloadNearbySlides(this.slides, numeric);
        updateSlideStatus(this);
        if (this.progressBar) {
          const width = this.slides.length <= 1 ? 100 : ((numeric + 1) / this.slides.length) * 100;
          this.progressBar.style.width = `${width}%`;
        }
        if (this.options.hash && !meta.replace) {
          history.replaceState(null, "", `#/${numeric + 1}`);
        }
        return this;
      },
      next() {
        return this.goTo(this.index + 1);
      },
      prev() {
        return this.goTo(this.index - 1);
      },
      destroy() {
        if (this.eventController) {
          this.eventController.abort();
        } else {
          window.removeEventListener("resize", this.onResize);
          window.removeEventListener("hashchange", this.onHashChange);
          window.removeEventListener("keydown", this.onKeydown);
          document.removeEventListener("fullscreenchange", this.onFullscreenChange);
          this.mount.removeEventListener("wheel", this.onWheel);
          this.mount.removeEventListener("touchstart", this.onTouchStart);
          this.mount.removeEventListener("touchend", this.onTouchEnd);
        }
        cancelAnimationFrame(this.scaleFrame);
        clearTimeout(this.statusMessageTimer);
        destroyTextSync(this);
      },
    };

    deck.theme = applyTheme(deck, deck.options.theme);

    deck.onResize = () => {
      cancelAnimationFrame(deck.scaleFrame);
      deck.scaleFrame = requestAnimationFrame(() => deck.updateScale());
    };
    deck.onHashChange = () => deck.goTo(readHashIndex() || 0, { replace: true });
    deck.onFullscreenChange = () => deck.syncPresentationState();
    deck.onWheel = (event) => {
      if (!deck.options.keyboard) return;
      if (event.target?.isContentEditable) return;
      const now = Date.now();
      if (now - deck.wheelLock < 520) return;
      if (Math.abs(event.deltaY) < 28) return;
      deck.wheelLock = now;
      event.preventDefault();
      if (event.deltaY > 0) deck.next();
      else deck.prev();
    };
    deck.onTouchStart = (event) => {
      if (!deck.options.keyboard) return;
      deck.touchStartY = event.touches?.[0]?.clientY ?? null;
    };
    deck.onTouchEnd = (event) => {
      if (!deck.options.keyboard || deck.touchStartY == null) return;
      const endY = event.changedTouches?.[0]?.clientY ?? deck.touchStartY;
      const deltaY = endY - deck.touchStartY;
      deck.touchStartY = null;
      if (Math.abs(deltaY) < 48) return;
      if (deltaY < 0) deck.next();
      else deck.prev();
    };
    deck.onKeydown = (event) => {
      if (!deck.options.keyboard) return;
      if (event.target?.isContentEditable) return;
      if (event.code === "Escape" && deck.isPresenting()) {
        event.preventDefault();
        deck.exitFullscreen();
        return;
      }
      if (["ArrowRight", "PageDown", "Space"].includes(event.code)) {
        event.preventDefault();
        deck.next();
      }
      if (["ArrowLeft", "PageUp"].includes(event.code)) {
        event.preventDefault();
        deck.prev();
      }
      if (event.code === "Home") deck.goTo(0);
      if (event.code === "End") deck.goTo(deck.slides.length - 1);
    };

    window.addEventListener("resize", deck.onResize, eventListenerOptions);
    window.addEventListener("hashchange", deck.onHashChange, eventListenerOptions);
    window.addEventListener("keydown", deck.onKeydown, eventListenerOptions);
    document.addEventListener("fullscreenchange", deck.onFullscreenChange, eventListenerOptions);
    mount.addEventListener("wheel", deck.onWheel, eventListenerOptions);
    mount.addEventListener("touchstart", deck.onTouchStart, eventListenerOptions);
    mount.addEventListener("touchend", deck.onTouchEnd, eventListenerOptions);

    return deck.renderDeck();
  }

  function createDeckSpec({
    title = "",
    description = "",
    theme = "larkVisual",
    size = DEFAULT_SIZE,
    slides = [],
    assets = {},
    meta = {},
  } = {}) {
    return {
      title,
      description,
      theme,
      size,
      slides: Array.from(slides),
      assets: { ...assets },
      meta: { ...meta },
    };
  }

  function normalizeCreateOptions(options = {}) {
    const spec = options.deck || options.spec;
    if (!spec) return options;

    return {
      ...spec,
      ...options,
      slides: options.slides || spec.slides || [],
      size: options.size || spec.size || DEFAULT_SIZE,
      theme: options.theme || spec.theme || "default",
      metadata: options.metadata || options.meta || spec.meta || {},
    };
  }

  function defineTheme(name, theme = {}) {
    if (!name || typeof name !== "string") {
      throw new Error("LarkSlides: theme name is required");
    }
    const normalized = {
      name,
      className: theme.className || "",
      cssVars: { ...(theme.cssVars || {}) },
      meta: { ...(theme.meta || {}) },
    };
    themes[name] = normalized;
    return normalized;
  }

  function resolveTheme(theme = "default") {
    if (typeof theme === "string") return themes[theme] || themes.default;
    if (theme && typeof theme === "object") {
      return {
        name: theme.name || "custom",
        className: theme.className || "",
        cssVars: { ...(theme.cssVars || {}) },
        meta: { ...(theme.meta || {}) },
      };
    }
    return themes.default;
  }

  function applyTheme(target, themeInput = "default") {
    const mount = target?.mount || target;
    const theme = resolveTheme(themeInput);
    if (!mount) return theme;

    if (mount.__larkThemeClass) mount.classList.remove(mount.__larkThemeClass);
    (mount.__larkThemeVars || []).forEach((property) => mount.style.removeProperty(property));

    if (mount.dataset) mount.dataset.larkTheme = theme.name;
    if (theme.className) mount.classList.add(theme.className);
    Object.entries(theme.cssVars || {}).forEach(([property, value]) => {
      mount.style.setProperty(property, value);
    });
    mount.__larkThemeClass = theme.className;
    mount.__larkThemeVars = Object.keys(theme.cssVars || {});
    return theme;
  }

  function updateScale() {
    const size = this?.options?.size || DEFAULT_SIZE;
    const stage = this?.stage || document.querySelector(".ls-stage");
    if (!stage) return;
    const scale = Math.min(stage.clientWidth / size.width, stage.clientHeight / size.height);
    const offsetX = (stage.clientWidth - size.width * scale) / 2;
    const offsetY = (stage.clientHeight - size.height * scale) / 2;
    const transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    if (this?.stage && this.scaleTransform === transform) return;
    if (this?.stage) this.scaleTransform = transform;

    const inners = this?.slideInners?.length
      ? this.slideInners
      : Array.from(stage.querySelectorAll(".ls-slide-inner"));
    inners.forEach((inner) => {
      inner.style.transform = transform;
    });
  }

  function enterFullscreen() {
    if (document.fullscreenElement === this.mount) return Promise.resolve(this);
    if (!this.mount.requestFullscreen) {
      this.syncPresentationState(true);
      return Promise.resolve(this);
    }
    return this.mount.requestFullscreen().then(() => this);
  }

  function exitFullscreen() {
    if (document.fullscreenElement === this.mount && document.exitFullscreen) {
      return document.exitFullscreen().then(() => this);
    }
    this.syncPresentationState(false);
    return Promise.resolve(this);
  }

  function toggleFullscreen() {
    return this.isPresenting() ? this.exitFullscreen() : this.enterFullscreen();
  }

  function isPresenting() {
    return this.mount.classList.contains("ls-presenting") || document.fullscreenElement === this.mount;
  }

  function syncPresentationState(force) {
    const isFullscreen = force ?? document.fullscreenElement === this.mount;
    this.mount.classList.toggle("ls-presenting", Boolean(isFullscreen));
    cancelAnimationFrame(this.scaleFrame);
    this.scaleFrame = requestAnimationFrame(() => this.updateScale());
    return this;
  }

  function setSlideActive(slide, isActive) {
    if (!slide) return;
    slide.hidden = !isActive;
    slide.classList.toggle("is-active", isActive);
  }

  function preloadNearbySlides(slides, index) {
    loadSlideImages(slides[index]);
    loadSlideImages(slides[index - 1]);
    loadSlideImages(slides[index + 1]);
    loadSlideImages(slides[index - 2]);
    loadSlideImages(slides[index + 2]);
  }

  function loadSlideImages(slide) {
    if (!slide) return;
    slide.querySelectorAll("img[data-src]").forEach((image) => {
      const source = image.dataset.src;
      if (!source) return;
      if (image.getAttribute("src") !== source) {
        image.classList.add("is-loading");
        image.addEventListener("load", markImageLoaded, { once: true });
        image.addEventListener("error", markImageLoaded, { once: true });
        image.setAttribute("src", source);
      }
      if (image.complete && image.getAttribute("src") === source) {
        markImageLoaded({ currentTarget: image });
      }
    });
  }

  function markImageLoaded(event) {
    const image = event.currentTarget;
    image.classList.remove("is-loading");
    image.classList.add("is-loaded");
    image.dataset.lsLoaded = "true";
  }

  function normalizeTextSyncOptions(input) {
    if (!input) return null;
    const options = typeof input === "string" ? { loadUrl: input, saveUrl: input } : { ...input };
    if (!options.loadUrl && !options.saveUrl) return null;
    return {
      deckId: options.deckId || options.id || "",
      loadUrl: options.loadUrl || options.url || "",
      saveUrl: options.saveUrl || options.url || "",
      loadMethod: options.loadMethod || "GET",
      saveMethod: options.saveMethod || "POST",
      headers: { ...(options.headers || {}) },
      loadHeaders: { ...(options.loadHeaders || {}) },
      saveHeaders: { ...(options.saveHeaders || {}) },
      credentials: options.credentials,
      saveDebounceMs: Number.isFinite(Number(options.saveDebounceMs))
        ? Number(options.saveDebounceMs)
        : DEFAULT_TEXT_SAVE_DEBOUNCE_MS,
      saveAll: options.saveAll !== false,
      editable: options.editable !== false,
      onLoad: options.onLoad,
      onSave: options.onSave,
      onError: options.onError,
    };
  }

  function setupTextSync(deck) {
    destroyTextSync(deck);
    const options = deck.options.textSync;
    if (!options) return null;

    const nodes = editableTextNodes(deck);
    const state = {
      options,
      nodes,
      values: {},
      timers: new Map(),
      pending: new Map(),
      saving: new Set(),
      loaded: false,
    };
    deck.textSync = state;

    nodes.forEach((node) => {
      if (options.editable && node.hasAttribute("data-editable-text") && node.getAttribute("contenteditable") !== "true") {
        node.setAttribute("contenteditable", "true");
      }
      node.dataset.larkTextSync = "true";
      node.__larkTextInputHandler = () => scheduleTextSave(deck, node);
      node.__larkTextBlurHandler = () => flushTextSave(deck, node);
      node.addEventListener("input", node.__larkTextInputHandler);
      node.addEventListener("blur", node.__larkTextBlurHandler);
    });

    if (options.loadUrl) {
      loadRemoteTexts(deck).catch((error) => handleTextSyncError(deck, error));
    }
    return state;
  }

  function destroyTextSync(deck) {
    const state = deck.textSync;
    if (!state) return;
    state.timers?.forEach((timer) => clearTimeout(timer));
    state.nodes?.forEach((node) => {
      if (node.__larkTextInputHandler) {
        node.removeEventListener("input", node.__larkTextInputHandler);
        delete node.__larkTextInputHandler;
      }
      if (node.__larkTextBlurHandler) {
        node.removeEventListener("blur", node.__larkTextBlurHandler);
        delete node.__larkTextBlurHandler;
      }
    });
    deck.textSync = null;
  }

  function editableTextNodes(deck) {
    const root = deck?.stage || document;
    return Array.from(root.querySelectorAll("[data-text-id]")).filter((node) =>
      node.matches?.('[contenteditable="true"], [data-editable-text], [data-text-id]')
    );
  }

  async function loadRemoteTexts(deck) {
    const options = deck.options.textSync;
    if (!options?.loadUrl) return {};
    const payload = await requestJson(options.loadUrl, {
      method: options.loadMethod,
      headers: mergeHeaders(options.headers, options.loadHeaders),
      credentials: options.credentials,
    });
    const values = normalizeTextPayload(payload);
    applyRemoteTexts(deck, values);
    if (deck.textSync) {
      deck.textSync.values = values;
      deck.textSync.loaded = true;
    }
    if (typeof options.onLoad === "function") options.onLoad(values, deck);
    return values;
  }

  function applyRemoteTexts(deck, values) {
    const nodes = editableTextNodes(deck);
    nodes.forEach((node) => {
      const id = node.dataset.textId;
      if (!id || !Object.prototype.hasOwnProperty.call(values, id)) return;
      applyTextValue(node, values[id]);
      node.dataset.larkTextRemote = "true";
    });
  }

  function normalizeTextPayload(payload) {
    const source = payload?.texts || payload?.items || payload?.data || payload || {};
    const result = {};
    if (Array.isArray(source)) {
      source.forEach((item) => {
        const id = item?.id || item?.textId || item?.key;
        if (id) result[id] = normalizeTextValue(item);
      });
      return result;
    }
    Object.entries(source).forEach(([id, value]) => {
      if (value == null) return;
      result[id] = normalizeTextValue(value);
    });
    return result;
  }

  function normalizeTextValue(value) {
    if (value && typeof value === "object" && !Array.isArray(value)) {
      if (value.html != null) return { html: String(value.html) };
      if (value.text != null) return { text: String(value.text) };
      if (value.value != null) return { text: String(value.value) };
    }
    return { text: String(value) };
  }

  function applyTextValue(node, value) {
    const normalized = normalizeTextValue(value);
    if (normalized.html != null) {
      node.innerHTML = normalized.html;
      return;
    }
    node.innerHTML = escapeHtml(normalized.text).replace(/\n/g, "<br>");
  }

  function scheduleTextSave(deck, node) {
    const state = deck.textSync;
    const options = state?.options;
    if (!state || !options?.saveUrl) return;
    const id = node.dataset.textId;
    if (!id) return;
    if (state.timers.has(id)) clearTimeout(state.timers.get(id));
    const timer = setTimeout(() => {
      state.timers.delete(id);
      saveTextNode(deck, node).catch((error) => handleTextSyncError(deck, error));
    }, Math.max(0, options.saveDebounceMs));
    state.timers.set(id, timer);
  }

  function flushTextSave(deck, node) {
    const state = deck.textSync;
    const id = node?.dataset?.textId;
    if (!state || !id || !state.timers.has(id)) return;
    clearTimeout(state.timers.get(id));
    state.timers.delete(id);
    saveTextNode(deck, node).catch((error) => handleTextSyncError(deck, error));
  }

  async function saveTextNode(deck, node) {
    const state = deck.textSync;
    const options = state?.options;
    if (!state || !options?.saveUrl) return null;
    const entry = serializeTextNode(node, deck);
    state.pending.set(entry.id, entry);
    state.saving.add(entry.id);
    node.dataset.larkTextSaving = "true";

    const payload = {
      deckId: options.deckId || deck.options.metadata?.id || deck.options.metadata?.title || "",
      activeSlide: deck.index + 1,
      changed: entry,
      texts: options.saveAll ? collectDeckTexts(deck) : undefined,
      updatedAt: new Date().toISOString(),
    };

    try {
      const response = await requestJson(options.saveUrl, {
        method: options.saveMethod,
        headers: mergeHeaders(options.headers, options.saveHeaders, { "Content-Type": "application/json" }),
        credentials: options.credentials,
        body: JSON.stringify(payload),
      });

      state.saving.delete(entry.id);
      state.pending.delete(entry.id);
      node.dataset.larkTextSaving = "false";
      node.dataset.larkTextSavedAt = payload.updatedAt;
      state.values[entry.id] = { html: entry.html, text: entry.text };
      if (typeof options.onSave === "function") options.onSave({ entry, payload, response }, deck);
      showToolbarMessage(deck, "已保存", 900);
      return response;
    } catch (error) {
      state.saving.delete(entry.id);
      node.dataset.larkTextSaving = "error";
      throw error;
    }
  }

  function saveCurrentTexts(deck) {
    const state = deck.textSync;
    if (!state?.options?.saveUrl) return Promise.resolve(null);
    const options = state.options;
    const payload = {
      deckId: options.deckId || deck.options.metadata?.id || deck.options.metadata?.title || "",
      activeSlide: deck.index + 1,
      changed: null,
      texts: collectDeckTexts(deck),
      updatedAt: new Date().toISOString(),
    };
    return requestJson(options.saveUrl, {
      method: options.saveMethod,
      headers: mergeHeaders(options.headers, options.saveHeaders, { "Content-Type": "application/json" }),
      credentials: options.credentials,
      body: JSON.stringify(payload),
    }).then((response) => {
      showToolbarMessage(deck, "已保存", 900);
      if (typeof options.onSave === "function") options.onSave({ entry: null, payload, response }, deck);
      return response;
    });
  }

  function serializeTextNode(node, deck) {
    const slide = node.closest(".ls-slide");
    return {
      id: node.dataset.textId,
      text: textFromNode(node),
      html: node.innerHTML,
      slide: slide?.dataset.index ? Number(slide.dataset.index) : deck.index + 1,
      slideId: slide?.id || "",
      slideTitle: slide?.dataset.title || "",
    };
  }

  function collectDeckTexts(deck) {
    return editableTextNodes(deck).reduce((acc, node) => {
      const item = serializeTextNode(node, deck);
      acc[item.id] = {
        text: item.text,
        html: item.html,
        slide: item.slide,
        slideId: item.slideId,
        slideTitle: item.slideTitle,
      };
      return acc;
    }, {});
  }

  function textFromNode(node) {
    if (typeof node.innerText === "string") return node.innerText.replace(/\u00a0/g, " ");
    return String(node.textContent || "").replace(/\u00a0/g, " ");
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function requestJson(url, options = {}) {
    if (typeof fetch !== "function") {
      throw new Error("LarkSlides: fetch is required for textSync");
    }
    const response = await fetch(url, options);
    if (!response.ok) throw new Error(`LarkSlides: textSync request failed ${response.status}`);
    if (response.status === 204) return {};
    const text = await response.text();
    return text ? JSON.parse(text) : {};
  }

  function mergeHeaders(...headersList) {
    return headersList.reduce((acc, headers) => {
      Object.entries(headers || {}).forEach(([key, value]) => {
        if (value != null) acc[key] = value;
      });
      return acc;
    }, {});
  }

  function handleTextSyncError(deck, error) {
    showToolbarMessage(deck, "保存异常", 1400);
    if (typeof deck.options.textSync?.onError === "function") {
      deck.options.textSync.onError(error, deck);
      return;
    }
    console.warn(error);
  }

  function updateSlideStatus(deck) {
    if (!deck.status) return;
    deck.status.textContent = `${deck.index + 1} / ${deck.slides.length}`;
  }

  function showToolbarMessage(deck, message, duration = 1200) {
    if (!deck.status) return;
    clearTimeout(deck.statusMessageTimer);
    deck.status.textContent = message;
    deck.statusMessageTimer = setTimeout(() => updateSlideStatus(deck), duration);
  }

  function currentSlideLink(deck) {
    const page = normalizeIndex(deck.index, deck.slides.length) + 1;
    if (typeof URL !== "undefined") {
      const url = new URL(location.href);
      url.hash = `/${page}`;
      return url.toString();
    }
    return `${location.href.replace(/#.*$/, "")}#/${page}`;
  }

  function copyCurrentSlideLink(deck) {
    const link = currentSlideLink(deck);
    return copyText(link).then(() => {
      showToolbarMessage(deck, "已复制", 900);
      return link;
    });
  }

  function copyText(text) {
    if (typeof navigator !== "undefined" && navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    return Promise.resolve();
  }

  function annotateEditableText(slides) {
    const slideList = Array.from(slides || document.querySelectorAll(".ls-slide"));
    let count = 0;
    slideList.forEach((slide, index) => {
      const slideId = `slide-${String(index + 1).padStart(2, "0")}`;
      const used = new Set(
        Array.from(slide.querySelectorAll("[data-text-id]")).map((node) => node.dataset.textId)
      );
      const counters = {};
      const editables = Array.from(slide.querySelectorAll('[contenteditable="true"], [data-editable-text]'));
      editables.forEach((node) => {
        if (node.dataset.textId) return;
        const base = editableTextBase(node);
        counters[base] = (counters[base] || 0) + 1;
        let field = counters[base] === 1 ? base : `${base}-${String(counters[base]).padStart(2, "0")}`;
        let textId = `${slideId}.${field}`;
        while (used.has(textId)) {
          counters[base] += 1;
          field = `${base}-${String(counters[base]).padStart(2, "0")}`;
          textId = `${slideId}.${field}`;
        }
        node.dataset.textId = textId;
        node.dataset.larkTextAutogen = "true";
        used.add(textId);
        count += 1;
      });
    });
    return count;
  }

  function editableTextBase(node) {
    const className = Array.from(node.classList || []).find((name) => !/^ls-/.test(name) && !/^lvg-layout-block$/.test(name));
    const base = className || node.tagName?.toLowerCase() || "text";
    return base
      .toLowerCase()
      .replace(/[^a-z0-9\u4e00-\u9fa5_-]+/g, "-")
      .replace(/^-+|-+$/g, "") || "text";
  }

  function normalizeIndex(index, length) {
    const numeric = Number(index);
    if (!Number.isFinite(numeric) || length <= 0) return 0;
    return Math.max(0, Math.min(length - 1, Math.trunc(numeric)));
  }

  function readHashIndex() {
    const match = location.hash.match(/^#\/(\d+)$/);
    if (!match) return 0;
    return Math.max(0, Number(match[1]) - 1);
  }

  window.LarkSlides = {
    themes,
    createDeckSpec,
    createDeck,
    renderDeck,
    mountControls,
    annotateEditableText,
    normalizeTextPayload,
    collectDeckTexts,
    loadRemoteTexts,
    saveCurrentTexts,
    currentSlideLink,
    copyCurrentSlideLink,
    defineTheme,
    applyTheme,
    enterFullscreen(deck) {
      return deck.enterFullscreen();
    },
    exitFullscreen(deck) {
      return deck.exitFullscreen();
    },
    toggleFullscreen(deck) {
      return deck.toggleFullscreen();
    },
    goTo(deck, index) {
      return deck.goTo(index);
    },
    next(deck) {
      return deck.next();
    },
    prev(deck) {
      return deck.prev();
    },
  };
})();

</script>
    <script>
(function () {
  "use strict";

  function escapeHtml(value) {

      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderList(items = [], renderItem) {

  function renderIf(value, renderValue) {

  }

  function imageTag(src, className = "", attrs = "") {
    const classAttr = className ? ` class="${escapeHtml(className)}"` : "";
    const extraAttrs = attrs ? ` ${attrs}` : "";
    return `<img${classAttr} data-src="${escapeHtml(src)}" alt="" decoding="async"${extraAttrs}>`;
  }

  const tokens = {
    canvas: { width: 1600, height: 900 },
    colors: {
      black: "#000000",
      white: "#ffffff",
      gray: "#858b96",
      lightBlue: "#ceeafe",
      cyan: "#3ec3f7",
      deepBlue: "#1456f0",
    },
    gradients: {
      brand: "linear-gradient(90deg, #e2fff7 0%, #c8effa 43%, #b1d5f6 62%, #80a3ff 100%)",
      soft: "linear-gradient(90deg, #ffffff 0%, #e2fff7 38%, #b1d5f6 68%, #80a3ff 100%)",
      gray: "linear-gradient(90deg, #e6e8ee 0%, #b5bac4 52%, #858b96 100%)",
      whiteGray: "linear-gradient(90deg, #f7f9ff 0%, #d9dee8 48%, #9ea8b8 100%)",
      deepBlue: "linear-gradient(90deg, #3ec3f7 0%, #1456f0 100%)",
    },
    fonts: {
      display: "var(--ld-font-display, \"TikTok Display\", \"FZLanTingHeiPro_GB18030\", \"PingFang SC\", \"Microsoft YaHei\", Arial, sans-serif)",
      zh: "var(--ld-font-zh, \"FZLanTingHeiPro_GB18030\", \"PingFang SC\", \"Microsoft YaHei\", Arial, sans-serif)",
      ui: "var(--ld-font-ui, \"Inter\", \"FZLanTingHeiPro_GB18030\", \"PingFang SC\", \"Microsoft YaHei\", Arial, sans-serif)",
      en: "\"TikTok Display\", \"Inter\", Arial, sans-serif",
    },
  };

  const templateRegistry = {};
  const templateContracts = {};

  const qualityRules = {
    canvas: { width: 1600, height: 900 },
    typography: {
      heroClaim: { min: 76, max: 92, weight: "740-760", lineHeight: "1.05-1.10" },
      sectionClaim: { min: 58, max: 68, weight: "700-760", lineHeight: "1.08-1.15" },
      subtitle: { min: 28, max: 40, weight: "400-600", lineHeight: "1.35-1.45" },
      body: { min: 20, max: 28, weight: "400-600", lineHeight: "1.35-1.55" },
      micro: { min: 12, max: 18, weight: "400-500", lineHeight: "1.30-1.50" },
    },
    defaults: {
      maxTitleChars: 34,
      maxSubtitleChars: 96,
      maxBodyChars: 220,
      maxItems: 6,
      maxBlocks: 96,
    },
  };

  const designGuidance = {
    name: "front-design keynote loop",
    intent: "Generate fewer, stronger, presentation-ready HTML slides before doing precision layout.",
    workflow: [
      "Compress the narrative before choosing a template.",
      "Map each slide to one job: statement, todo, caseFlow, metric, or precision visualLayout.",
      "Keep one dominant focal point per slide; supporting text should be short and visibly secondary.",
      "Use the 1600x900 typography scale instead of web UI defaults.",
      "Preview screenshots and fix alignment, density, and hierarchy before publishing.",
    ],
    layout: [
      "Prefer large centered claims, generous negative space, and dividers only when they clarify grouping or direction.",
      "Avoid nested cards, decorative card grids, and repeated equal-weight boxes.",
      "Use columns only when comparison or process flow is the actual message.",
      "Keep tags rectangular and precise; do not use overly round pill shapes unless the source deck does.",
    ],
    typography: [
      "Hero claim: 76-92px on the 1600x900 canvas.",
      "Section claim: 58-68px.",
      "Subtitle: 28-40px.",
      "Body and labels: 20-28px, except metadata labels can use 12-18px.",
    ],
    antiPatterns: [
      "Starting from HTML/CSS layout before the page story is clear.",
      "Filling a slide with many cards because the content has many bullets.",
      "Adding lvg-layout-shape lines as decoration when spacing and alignment already separate the content.",
      "Using web-dashboard density for a fullscreen presentation.",
      "Adding glow, shine, or gradients when they do not clarify hierarchy.",
    ],
    verification: [
      "Run validateDeckSpec for structure and density.",
      "Run scripts/validate_deck.js for HTML entrypoint checks.",
      "Use browser screenshots to inspect alignment, clipping, and perceived type size.",
    ],
  };

  function normalizeContract(contract = {}) {
    return {
      intent: contract.intent || "",
      slots: { ...(contract.slots || {}) },
      limits: { ...(contract.limits || {}) },
      guidance: Array.from(contract.guidance || []),
    };
  }

  function defineTemplate(name, renderer, contract = {}) {
    if (!name || typeof name !== "string") throw new Error("LarkSlideTemplates: template name is required");
    if (typeof renderer !== "function") throw new Error(`LarkSlideTemplates: ${name} must be a function`);
    templateRegistry[name] = renderer;
    templateContracts[name] = normalizeContract(contract);
    return renderer;
  }

  function normalizeTemplateName(name = "") {
    return String(name).replace(/-([a-z])/g, (_, char) => char.toUpperCase());
  }

  function resolveTemplateName(name = "") {
    const value = String(name || "");
    if (templateRegistry[value] || templateContracts[value]) return value;
    const normalized = normalizeTemplateName(value);
    if (templateRegistry[normalized] || templateContracts[normalized]) return normalized;
    return value;
  }

  function create(name, props = {}) {
    const renderer = typeof name === "function" ? name : templateRegistry[name];
    if (!renderer) throw new Error(`LarkSlideTemplates: unknown template ${name}`);
    return renderer(props);
  }

  function templateNames() {
    return Object.keys(templateRegistry);
  }

  function getTemplateContract(name) {
    const resolved = resolveTemplateName(name);
    return templateContracts[resolved]
      ? {
          ...templateContracts[resolved],
          slots: { ...templateContracts[resolved].slots },
          limits: { ...templateContracts[resolved].limits },
          guidance: Array.from(templateContracts[resolved].guidance || []),
        }
      : null;
  }

  function getDesignGuidance() {
    return {
      ...designGuidance,
      workflow: Array.from(designGuidance.workflow),
      layout: Array.from(designGuidance.layout),
      typography: Array.from(designGuidance.typography),
      antiPatterns: Array.from(designGuidance.antiPatterns),
      verification: Array.from(designGuidance.verification),
    };
  }

  function plainText(value = "") {
    return String(value ?? "")
      .replace(/<script[\s\S]*?<\/script>/gi, " ")
      .replace(/<style[\s\S]*?<\/style>/gi, " ")
      .replace(/<[^>]+>/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function textLength(value = "") {
    return plainText(value).length;
  }

  function addIssue(list, level, code, message, details = {}) {
    list.push({ level, code, message, ...details });
  }

  function validateDeckSpec(spec = {}, options = {}) {
    const issues = [];
    const rules = { ...qualityRules.defaults, ...(options.rules || {}) };
    const slides = Array.isArray(spec.slides) ? spec.slides : [];
    const size = spec.size || qualityRules.canvas;

    if (!spec.title) addIssue(issues, "warning", "deck-title-missing", "Deck title is missing.");
    if (!slides.length) addIssue(issues, "error", "slides-empty", "Deck has no slides.");
    if (size.width !== qualityRules.canvas.width || size.height !== qualityRules.canvas.height) {
      addIssue(issues, "warning", "canvas-size", "DeckKit is tuned for 1600x900 slides.", { size });
    }

    slides.forEach((slide, index) => {
      const label = `slide ${index + 1}`;
      const resolvedTemplate = slide.template ? resolveTemplateName(slide.template) : "";
      const contract = resolvedTemplate ? templateContracts[resolvedTemplate] : null;
      const limits = { ...rules, ...(contract?.limits || {}) };
      const titleLength = textLength(slide.title || "");
      const contentLength = textLength(slide.content || "");

      if (!slide.title) addIssue(issues, "warning", "slide-title-missing", `${label} has no title.`, { index });
      if (slide.template && !templateRegistry[resolvedTemplate]) {
        addIssue(issues, "warning", "template-unknown", `${label} uses an unknown template "${slide.template}".`, { index, template: slide.template });
      }
      if (titleLength > limits.maxTitleChars) {
        addIssue(issues, "warning", "title-density", `${label} title is long; split or shorten for keynote-quality layout.`, { index, length: titleLength, max: limits.maxTitleChars });
      }
      if (contentLength > limits.maxBodyChars) {
        addIssue(issues, "warning", "content-density", `${label} has dense text; use a higher-level template or split into multiple slides.`, { index, length: contentLength, max: limits.maxBodyChars });
      }
      if (slide.template === "visual-layout") {
        const blockCount = (slide.content || "").match(/lvg-layout-block/g)?.length || 0;
        if (blockCount > limits.maxBlocks) {
          addIssue(issues, "warning", "block-density", `${label} has many absolute blocks; prefer a stable pattern template for new decks.`, { index, blockCount, max: limits.maxBlocks });
        }
      }
    });

    return {
      ok: !issues.some((issue) => issue.level === "error"),
      issueCount: issues.length,
      errors: issues.filter((issue) => issue.level === "error").length,
      warnings: issues.filter((issue) => issue.level === "warning").length,
      issues,
    };
  }

  function asset(basePath = "") {
    const prefix = String(basePath || "").replace(/\/+$/, "");
    return (name) => {
      const value = String(name || "");
      if (!value) return "";
      if (/^(?:https?:\/\/|data:|blob:|\/)/.test(value)) return value;
      const path = value.replace(/^\/+/, "");
      return prefix ? `${prefix}/${path}` : path;
    };
  }

  function deckSpec({
    title = "",
    description = "",
    theme = "larkVisual",
    slides = [],
    assets = {},
    meta = {},
  } = {}) {
    const createDeckSpec = window.LarkSlides?.createDeckSpec;
    if (createDeckSpec) return createDeckSpec({ title, description, theme, slides, assets, meta });
    return { title, description, theme, slides: Array.from(slides), assets: { ...assets }, meta: { ...meta } };
  }

  function geometryStyle({ x, y, w, h, style = "" } = {}) {
    const parts = ["position:absolute;"];
    if (x != null) parts.push(`left:${Number(x).toFixed(3)}px;`);
    if (y != null) parts.push(`top:${Number(y).toFixed(3)}px;`);
    if (w != null) parts.push(`width:${Number(w).toFixed(3)}px;`);
    if (h != null) parts.push(`height:${Number(h).toFixed(3)}px;`);
    if (style) parts.push(style);
    return parts.join("");
  }

  function gradientClass(gradient) {
    if (!gradient) return "";
    const variants = {
      brand: "brand",
      soft: "soft",
      gray: "gray",
      whiteGray: "white-gray",
      deepBlue: "deep-blue",
    };
    return `lvg-gradient-text ${variants[gradient] || escapeHtml(gradient)}`;
  }

  function gradientText(text, gradient = "brand", className = "") {
    const classes = [gradientClass(gradient), className].filter(Boolean).join(" ");
    return `<span class="${classes}">${escapeHtml(text)}</span>`;
  }

  function textBlock({
    x,
    y,
    w,
    h,
    text = "",
    html,
    className = "",
    style = "",
    align = "left",
    size = 48,
    color = tokens.colors.white,
    weight = 700,
    lineHeight = 1.15,
    gradient = "",
  } = {}) {
    const blockStyleValue = geometryStyle({ x, y, w, h, style: `background:transparent;${style}` });
    const spanClass = gradient ? ` class="${gradientClass(gradient)}"` : "";
    const spanStyles = [
      `font-size:${Number(size).toFixed(3)}px;`,
      `font-weight:${escapeHtml(weight)};`,
      gradient ? "" : `color:${escapeHtml(color)};`,
    ].join("");
    const spanStyle = ` style="${spanStyles}"`;
    const body =
      html != null
        ? html
        : `<p style="text-align:${escapeHtml(align)};line-height:${escapeHtml(lineHeight)};"><span${spanClass}${spanStyle}>${escapeHtml(text)}</span></p>`;
    return { kind: "text", className, style: blockStyleValue, html: body };
  }

  function imageBlock({
    src,
    x = 0,
    y = 0,
    w = tokens.canvas.width,
    h = tokens.canvas.height,
    fit = "cover",
    className = "",
    style = "",
    innerStyle,
  } = {}) {
    return {
      kind: "image",
      className,
      src,
      style: geometryStyle({ x, y, w, h, style }),
      innerStyle: innerStyle || `left:0;top:0;width:100%;height:100%;object-fit:${escapeHtml(fit)};`,
    };
  }

  function shapeBlock({
    x,
    y,
    w,
    h,
    fill = "transparent",
    radius,
    border,
    opacity,
    className = "",
    style = "",
  } = {}) {
    const shapeStyle = [
      `background:${fill};`,
      radius ? `border-radius:${escapeHtml(radius)};` : "",
      border ? `border:${border};` : "",
      opacity != null ? `opacity:${Number(opacity).toFixed(3)};` : "",
      style,
    ].join("");
    return { kind: "shape", className, style: geometryStyle({ x, y, w, h, style: shapeStyle }) };
  }

  function vectorBlock({ html = "", x, y, w, h, className = "", style = "" } = {}) {
    return { kind: "vector", className, html, style: geometryStyle({ x, y, w, h, style }) };
  }

  function layoutGrid({ x = 120, y = 0, w = 1360, columns = 3, gap = 32 } = {}) {
    const safeColumns = Math.max(1, Number(columns) || 1);
    const safeGap = Number(gap) || 0;
    const colW = (Number(w) - safeGap * (safeColumns - 1)) / safeColumns;
    return {
      x: Number(x),
      y: Number(y),
      w: Number(w),
      columns: safeColumns,
      gap: safeGap,
      colW,
      col(index = 0, span = 1) {
        const safeSpan = Math.max(1, Number(span) || 1);
        return {
          x: Number(x) + Number(index) * (colW + safeGap),
          y: Number(y),
          w: colW * safeSpan + safeGap * (safeSpan - 1),
        };
      },
    };
  }

  function paragraphList(items = []) {
    return renderList(items, (item) => `<p class="ls-template-label">${escapeHtml(item)}</p>`);
  }

  function cover({ title, subtitle, kicker } = {}) {

          </div>

  function imageHero({ title, subtitle, image, align = "left" } = {}) {

            <h1 class="ls-template-title" style="max-width:900px;color:#fff;">${escapeHtml(title)}</h1>
            ${renderIf(subtitle, (text) => `<p class="ls-template-subtitle" style="color:rgba(255,255,255,0.82);">${escapeHtml(text)}</p>`)}

  function metric({ title, metrics = [] } = {}) {
    return {

          <h1 class="ls-template-title" style="font-size:58px;">${escapeHtml(title)}</h1>

  function editable(value, className = "", tag = "span") {
    return `<${tag}${className ? ` class="${className}"` : ""} contenteditable="true">${escapeHtml(value)}</${tag}>`;
  }

  function richText(parts = []) {
    return parts
      .map((part) => {
        if (typeof part === "string") return escapeHtml(part);
        const className = part.className ? ` class="${escapeHtml(part.className)}"` : "";
        return `<span${className}>${escapeHtml(part.text)}</span>`;
      })
      .join("");
  }

  function visualSlide({ title, template, sourceSlide, content, className = "" }) {
    return {
      title,
      template,
      sourceSlide,
      className: `ls-visual ${className}`.trim(),

  }

  function blockStyle(block = {}) {
    if (block.style) return block.style;
    const parts = ["position:absolute;"];
    if (block.x != null) parts.push(`left:${Number(block.x).toFixed(3)}px;`);
    if (block.y != null) parts.push(`top:${Number(block.y).toFixed(3)}px;`);
    if (block.w != null) parts.push(`width:${Number(block.w).toFixed(3)}px;`);
    if (block.h != null) parts.push(`height:${Number(block.h).toFixed(3)}px;`);
    if (block.opacity != null) parts.push(`opacity:${Number(block.opacity).toFixed(3)};`);
    if (block.fill) parts.push(`background:${block.fill};`);
    if (block.color) parts.push(`color:${block.color};`);
    if (block.size) parts.push(`font-size:${Number(block.size).toFixed(3)}px;`);
    if (block.weight) parts.push(`font-weight:${escapeHtml(block.weight)};`);
    if (block.align) parts.push(`text-align:${escapeHtml(block.align)};`);
    if (block.lineHeight) parts.push(`line-height:${escapeHtml(block.lineHeight)};`);
    if (block.radius) parts.push(`border-radius:${escapeHtml(block.radius)};`);
    if (block.border) parts.push(`border:${block.border};`);
    return parts.join("");
  }

  function visualLayoutBlock(block = {}) {
    const className = block.className ? ` ${escapeHtml(block.className)}` : "";
    const style = escapeHtml(blockStyle(block));
    if (block.kind === "image") {
      const innerStyle = block.innerStyle ? escapeHtml(block.innerStyle) : "left:0;top:0;width:100%;height:100%;";
      return `
        <div class="lvg-layout-block lvg-layout-image${className}" style="${style}">
          <img data-src="${escapeHtml(block.src)}" alt="" decoding="async" style="${innerStyle}">
        </div>
      `;
    }
    if (block.kind === "shape") {
      return `<div class="lvg-layout-block lvg-layout-shape${className}" style="${style}"></div>`;
    }
    if (block.kind === "vector" || block.kind === "raw") {
      return `<div class="lvg-layout-block lvg-layout-vector${className}" style="${style}">${block.html || ""}</div>`;
    }
    if (block.kind === "text") {
      const body = block.html != null ? block.html : escapeHtml(block.text || "");
      return `<div class="lvg-layout-block lvg-layout-text${className}" contenteditable="true" style="${style}">${body}</div>`;
    }
    return "";
  }

  function visualLayout({ title, sourceSlide, blocks = [], className = "" } = {}) {
    return visualSlide({
      title,
      template: "visual-layout",
      sourceSlide,
      className: `lvg-layout-slide ${className}`.trim(),
      content: `
          <div class="lvg-slide lvg-layout">
          ${renderList(blocks, visualLayoutBlock)}
        </div>

    });

  function visualStatement({ title, subtitle, kicker = "", sourceSlide } = {}) {
    return visualLayout({
      title,
      sourceSlide,
      className: "lvg-quick-slide lvg-quick-apple lvg-quick-statement",
      blocks: [
        ...visualBackgroundBlocks(),
        quickText({ x: 0, y: 174, w: 1600, h: 28, text: kicker, size: 19, weight: 640, align: "center", color: "#7b8494", className: "lvg-quick-copy" }),
        quickText({ x: 180, y: 268, w: 1240, h: 126, text: title, size: 76, weight: 760, align: "center", gradient: "brand", lineHeight: 1.05, className: "lvg-quick-heading" }),
        quickText({ x: 360, y: 456, w: 880, h: 86, text: subtitle, size: 29, weight: 500, align: "center", color: "#b9c2d1", lineHeight: 1.36, className: "lvg-quick-copy" }),
        shapeBlock({ x: 610, y: 604, w: 380, h: 2, fill: tokens.gradients.deepBlue, radius: "999px", opacity: 0.82 }),

  function visualTodoList({ title, subtitle = "", items = [], sourceSlide } = {}) {
    const visibleItems = Array.from(items).slice(0, 5);
    const blocks = [

      quickText({ x: 240, y: 106, w: 1120, h: 74, text: title, size: 60, weight: 760, align: "center", gradient: "brand", className: "lvg-quick-heading" }),
      quickText({ x: 330, y: 196, w: 940, h: 42, text: subtitle, size: 28, weight: 500, align: "center", color: "#aeb7c7", lineHeight: 1.36, className: "lvg-quick-copy" }),
    ];
    if (visibleItems.length <= 5) {
      const grid = layoutGrid({ x: 216, y: 348, w: 1168, columns: visibleItems.length, gap: 56 });
      visibleItems.forEach((item, index) => {
        const col = grid.col(index);
        const label = item.label || `Step ${index + 1}`;
        const heading = item.title || item.heading || "";
        const body = item.body || item.text || "";
        blocks.push(quickText({ x: col.x, y: grid.y, w: col.w, h: 44, text: String(index + 1).padStart(2, "0"), size: 40, weight: 720, align: "center", gradient: "deepBlue", className: "lvg-quick-heading" }));
        blocks.push(quickText({ x: col.x, y: grid.y + 82, w: col.w, h: 22, text: label, size: 17, weight: 650, align: "center", color: "#7f8aa0", className: "lvg-quick-copy" }));
        blocks.push(quickText({ x: col.x, y: grid.y + 116, w: col.w, h: 34, text: heading, size: 28, weight: 740, align: "center", gradient: "brand", className: "lvg-quick-heading" }));
        blocks.push(quickText({ x: col.x - 4, y: grid.y + 178, w: col.w + 8, h: 102, text: body, size: 21, weight: 500, align: "center", color: "#aeb7c7", lineHeight: 1.34, className: "lvg-quick-copy" }));
      });
      return visualLayout({ title, sourceSlide, className: "lvg-quick-slide lvg-quick-apple lvg-quick-todo", blocks });
    }
    const rowH = 88;
    const startY = 286;
    blocks.push(shapeBlock({ x: 238, y: 250, w: 1124, h: Math.max(visibleItems.length * rowH + 64, 300), fill: "rgba(255,255,255,0.035)", radius: "8px", border: "1.2px solid rgba(62,195,247,0.34)" }));
    visibleItems.forEach((item, index) => {
      const y = startY + index * rowH;
      const label = item.label || `Step ${index + 1}`;
      const heading = item.title || item.heading || "";
      const body = item.body || item.text || "";
      const chips = Array.from(item.chips || []).slice(0, 3);
      blocks.push(shapeBlock({ x: 292, y, w: 1016, h: rowH - 14, fill: "rgba(3,10,23,0.62)", radius: "8px", border: "1.1px solid rgba(62,195,247,0.22)" }));
      blocks.push(shapeBlock({ x: 318, y: y + 27, w: 30, h: 30, fill: "rgba(62,195,247,0.12)", radius: "6px", border: "1.2px solid rgba(62,195,247,0.62)" }));
      blocks.push(quickText({ x: 318, y: y + 29, w: 30, h: 26, text: "✓", size: 21, weight: 760, align: "center", gradient: "deepBlue" }));
      blocks.push(quickText({ x: 374, y: y + 18, w: 148, h: 26, text: label, size: 19, weight: 720, gradient: "deepBlue", className: "lvg-quick-copy" }));
      blocks.push(quickText({ x: 374, y: y + 47, w: 230, h: 32, text: heading, size: 27, weight: 740, gradient: "brand", className: "lvg-quick-heading" }));
      blocks.push(quickText({ x: 628, y: y + 25, w: chips.length ? 374 : 604, h: 42, text: body, size: 21, weight: 500, color: "#aeb7c7", lineHeight: 1.3, className: "lvg-quick-copy" }));
      chips.forEach((chip, chipIndex) => {
        const chipX = 1042 + chipIndex * 88;
        blocks.push(shapeBlock({ x: chipX, y: y + 27, w: 74, h: 32, fill: "rgba(255,255,255,0.04)", radius: "6px", border: "1px solid rgba(62,195,247,0.30)" }));
        blocks.push(quickText({ x: chipX, y: y + 35, w: 74, h: 18, text: chip, size: 13, weight: 620, align: "center", color: "#dceeff", className: "lvg-quick-copy" }));
      });
    });

    const visibleSteps = Array.from(steps).slice(0, 4);

  function createDeckFromOutline({ title = "", description = "", theme = "larkVisual", slides = [], meta = {} } = {}) {
    const renderedSlides = Array.from(slides).map((slide) => {
      const type = slide.type || slide.template || "statement";
      if (type === "statement" || type === "title") return visualStatement(slide);
      if (type === "todo" || type === "todoList") return visualTodoList(slide);
      if (type === "caseFlow" || type === "flow") return visualCaseFlow(slide);
      if (templateRegistry[type]) return create(type, slide);
      return visualStatement(slide);
    });
    return deckSpec({ title, description, theme, slides: renderedSlides, meta });

                <p class="showcase-subtitle" contenteditable="true" data-text-id="slide-02.subtitle">这不是截图播放器，而是可继续维护的 HTML 演示稿运行时。</p>
              </div>
              <div class="capability-grid">
                <article class="capability-card"><span class="capability-chip">Runtime</span><h2 contenteditable="true" data-text-id="slide-02.card-1-title">16:9 播放器</h2><p contenteditable="true" data-text-id="slide-02.card-1-body">翻页、Hash 跳页、全屏、缩放、预加载和底部进度条。</p></article>
                <article class="capability-card"><span class="capability-chip">Templates</span><h2 contenteditable="true" data-text-id="slide-02.card-2-title">模板生成</h2><p contenteditable="true" data-text-id="slide-02.card-2-body">createDeckFromOutline 生成 statement、todo、caseFlow 等稳定页面。</p></article>
                <article class="capability-card"><span class="capability-chip">Layout</span><h2 contenteditable="true" data-text-id="slide-02.card-3-title">精确布局</h2><p contenteditable="true" data-text-id="slide-02.card-3-body">visualLayout 用 1600x900 坐标放置图片、文字、形状和 SVG。</p></article>
                <article class="capability-card"><span class="capability-chip">Editable</span><h2 contenteditable="true" data-text-id="slide-02.card-4-title">可编辑文案</h2><p contenteditable="true" data-text-id="slide-02.card-4-body">contenteditable 与 data-text-id 让标题、标签、正文都能继续修改。</p></article>
                <article class="capability-card"><span class="capability-chip">Mocks</span><h2 contenteditable="true" data-text-id="slide-02.card-5-title">产品原型</h2><p contenteditable="true" data-text-id="slide-02.card-5-body">product-mocks 覆盖聊天、文档、多维表格、会议、任务、日历等示意。</p></article>
                <article class="capability-card"><span class="capability-chip">Share</span><h2 contenteditable="true" data-text-id="slide-02.card-6-title">分享定位</h2><p contenteditable="true" data-text-id="slide-02.card-6-body">复制当前页链接会带 #/页码，别人打开后直接到对应页面。</p></article>
              </div>
            </section>
          `,
        },
        {
          title: "交付能力",
          sourceSlide: 3,
          content: `
            <section class="showcase-slide">
              <div class="slide-head">
                <h1 class="showcase-title" contenteditable="true" data-text-id="slide-03.title">从 PPTX 到可交付资产</h1>
                <p class="showcase-subtitle" contenteditable="true" data-text-id="slide-03.subtitle">项目里同时沉淀了转换、校验、打包、发布和素材索引链路。</p>
              </div>
              <div class="pipeline">
                <article class="pipeline-card"><span class="pipeline-num">01</span><h2 contenteditable="true" data-text-id="slide-03.pipe-1">PPTX 转 HTML</h2><p contenteditable="true" data-text-id="slide-03.pipe-1-body">抽取页面、图片、文本、母版背景和基础形状。</p></article>
                <article class="pipeline-card"><span class="pipeline-num">02</span><h2 contenteditable="true" data-text-id="slide-03.pipe-2">文本 sidecar</h2><p contenteditable="true" data-text-id="slide-03.pipe-2-body">texts.md 承接文案修改，HTML 保持版式稳定。</p></article>
                <article class="pipeline-card"><span class="pipeline-num">03</span><h2 contenteditable="true" data-text-id="slide-03.pipe-3">云端文本</h2><p contenteditable="true" data-text-id="slide-03.pipe-3-body">textSync 可接 window.magic.store、FaaS、KV 或数据库。</p></article>
                <article class="pipeline-card"><span class="pipeline-num">04</span><h2 contenteditable="true" data-text-id="slide-03.pipe-4">交付打包</h2><p contenteditable="true" data-text-id="slide-03.pipe-4-body">delivery_* 脚本生成清单、反馈模板和 zip 包。</p></article>
                <article class="pipeline-card"><span class="pipeline-num">05</span><h2 contenteditable="true" data-text-id="slide-03.pipe-5">妙笔发布</h2><p contenteditable="true" data-text-id="slide-03.pipe-5-body">单文件 HTML 发布到妙笔空间，资源外链化到 TOS。</p></article>
              </div>
              <div class="metrics-row">
                <div class="metric"><strong>299</strong><span>原始 PPTX 媒体文件</span></div>
                <div class="metric"><strong>215</strong><span>公共素材池资产</span></div>
                <div class="metric"><strong>30</strong><span>当前测试用例通过</span></div>
                <div class="metric"><strong>1</strong><span>HTML 文件即可发布</span></div>
              </div>
            </section>
          `,
        },
      ];

      const deckSpec = LarkSlides.createDeckSpec({
        title: "Lark DeckKit Usage Showcase",
        theme: "larkVisual",
        slides,
        meta: {
          id: DECK_ID,
          title: "Lark DeckKit Usage Showcase",
        },
      });

      installMagicTextSyncEndpoint();

      const deck = LarkSlides.createDeck({
        mount: "#deck",
        deck: deckSpec,
        textSync: {
          deckId: DECK_ID,
          loadUrl: `${MAGIC_TEXT_SYNC_ENDPOINT}?id=${encodeURIComponent(DECK_ID)}`,
          saveUrl: MAGIC_TEXT_SYNC_ENDPOINT,
          saveDebounceMs: 500,
        },
      });

      window.LarkDeckKitUsageShowcase = deck;

      function installMagicTextSyncEndpoint() {
        if (window.__LARK_DECKKIT_USAGE_SHOWCASE_FETCH_INSTALLED__) return;
        window.__LARK_DECKKIT_USAGE_SHOWCASE_FETCH_INSTALLED__ = true;
        const nativeFetch = window.fetch.bind(window);
        window.fetch = async (resource, options = {}) => {
          const url = typeof resource === "string" ? resource : resource?.url || "";
          if (!url.startsWith(MAGIC_TEXT_SYNC_ENDPOINT)) return nativeFetch(resource, options);
          return handleMagicTextSyncRequest(url, options);
        };
      }

      async function handleMagicTextSyncRequest(url, options = {}) {
        const method = String(options.method || "GET").toUpperCase();
        const requestUrl = new URL(url);
        const deckId = requestUrl.searchParams.get("id") || DECK_ID;
        if (method === "GET") return jsonResponse(await readTextRecord(deckId));
        if (method === "POST") {
          const payload = JSON.parse(options.body || "{}");
          const next = mergeTextRecord(await readTextRecord(payload.deckId || deckId), payload);
          await writeTextRecord(next.deckId, next);
          return jsonResponse({ ok: true, deckId: next.deckId, updatedAt: next.updatedAt, changed: next.changed });
        }
        return jsonResponse({ ok: false, error: "Method not allowed" }, 405);
      }

      async function readTextRecord(deckId) {
        const key = TEXT_STORE_PREFIX + deckId;
        const store = getMagicStore();
        if (store) {
          const raw = await store.global_get(key);
          const parsed = parseStoredValue(raw);
          if (parsed) return parsed;
        }
        return memoryTextStore.get(key) || defaultTextRecord(deckId);
      }

      async function writeTextRecord(deckId, record) {
        const key = TEXT_STORE_PREFIX + deckId;
        const store = getMagicStore();
        if (store) await store.global_set(key, JSON.stringify(record));
        memoryTextStore.set(key, record);
      }

      function getMagicStore() {
        const store = window.magic?.store || window.magic?.redis;
        if (store && typeof store.global_get === "function" && typeof store.global_set === "function") return store;
        return null;
      }

      function defaultTextRecord(deckId) {
        return {
          deckId,
          texts: { ...DEFAULT_TEXTS },
          changed: null,
          updatedAt: new Date().toISOString(),
        };
      }

      function mergeTextRecord(current, payload) {
        const next = {
          deckId: payload.deckId || current.deckId || DECK_ID,
          texts: {
            ...(current.texts || {}),
            ...(payload.texts || {}),
          },
          changed: payload.changed || null,
          updatedAt: payload.updatedAt || new Date().toISOString(),
        };
        if (payload.changed?.id) {
          next.texts[payload.changed.id] = {
            text: payload.changed.text || "",
            html: payload.changed.html || "",
            slide: payload.changed.slide || null,
          };
        }
        return next;
      }

      function parseStoredValue(raw) {
        if (!raw) return null;
        if (typeof raw === "object") return raw;
        try {
          return JSON.parse(String(raw));
        } catch (_error) {
          return null;
        }
      }

      function jsonResponse(body, status = 200) {
        return new Response(JSON.stringify(body), {
          status,
          headers: { "Content-Type": "application/json; charset=utf-8" },
        });
      }
    </script>
  </body>
</html>
